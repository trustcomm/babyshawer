<style>
:root{
  --night:#0F1B2D;--ivory:#FBF7EF;--sage:#A8C3B2;--powder:#B9D3EA;--blush:#F2C9CF;--gold:#C9A45C;--ink:#2A3441;
  --gold-deep:#A6843E;--card:#FFFDF8;--accent:var(--sage);--accent-deep:#6F9580;
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);--ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --f-ar-display:'Amiri','Noto Naskh Arabic',serif;--f-ar:'Noto Naskh Arabic','Amiri',serif;
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;--f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 16.5px/1.6 var(--f-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100vh;height:100dvh}
::selection{background:rgba(201,164,92,.28)}
[lang=ar],[lang=ur]{letter-spacing:0!important;font-style:normal!important;word-spacing:normal}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.defs{position:absolute;width:0;height:0;overflow:hidden}
svg{display:block}

/* ---------- Opener ---------- */
#opener{position:fixed;inset:0;z-index:50;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none}
#opener::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 45%,transparent 40%,rgba(5,10,20,.55) 100%)}
.op-pattern{position:absolute;inset:0;opacity:.035;pointer-events:none}
.op-sky{position:absolute;inset:0;pointer-events:none}
.op-sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#FFF6E0;opacity:0}
.op-moon{position:relative;z-index:2;width:clamp(46px,13vw,68px);aspect-ratio:1/1;margin-bottom:clamp(12px,3vh,26px);opacity:0}
.op-moon svg,.moon-flyer svg{width:100%;height:100%;overflow:visible}
.op-moon svg{transform:rotate(-35deg);filter:drop-shadow(0 0 12px rgba(244,226,180,.55)) drop-shadow(0 0 36px rgba(244,226,180,.2))}
.op-moon .moon-shape{fill:#F1E8D2}
.op-moon .moon-star{opacity:0}
.stage{position:relative;z-index:2;width:min(62vw,270px,40vh);aspect-ratio:300/440;perspective:1200px;transform-origin:50% 60%;will-change:transform}
.stage>*{position:absolute}
.stage .inner-sky,.stage .arch-lines{inset:0;width:100%;height:100%;overflow:visible}
.stage .inner-sky{opacity:0}
.arch-lines path{fill:none;stroke:var(--gold);stroke-linecap:round}
.glow{left:-40%;right:-40%;top:0;bottom:-20%;background:radial-gradient(closest-side at 50% 62%,rgba(255,232,186,.95),rgba(255,206,140,.45) 45%,rgba(255,206,140,0) 100%);opacity:0;pointer-events:none}
.door{top:0;height:100%;width:50%;opacity:0;transform-style:preserve-3d;will-change:transform}
.door svg{width:100%;height:100%;overflow:visible}
.door.l{left:0;transform-origin:17.33% 50%}
.door.r{left:50%;transform-origin:82.67% 50%}
.door .base{fill:#15253C}
.door .panel{fill:url(#lat);stroke:var(--gold);stroke-width:.6;stroke-opacity:.7}
.door .edge{fill:none;stroke:var(--gold);stroke-width:1.1}
.door .knob{fill:var(--gold)}
.lantern{left:50%;top:3.2%;width:13%;margin-left:-6.5%;transform-origin:50% 0;opacity:0}
.lantern svg{width:100%;height:auto;overflow:visible}
.lantern .flame{animation:lanternGlow 3.2s ease-in-out infinite}
@keyframes lanternGlow{0%,100%{opacity:.75}50%{opacity:1}}
.op-text{position:relative;z-index:2;min-height:84px;margin-top:clamp(14px,3vh,26px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.op-greet{font-family:var(--f-display);font-style:italic;font-weight:300;font-size:21px;color:#EDE3CC;opacity:0;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-tap{display:inline-flex;align-items:center;gap:12px;font:600 11px/1 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:0;padding-left:.3em}
.op-tap::before,.op-tap::after{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
.moon-flyer{position:fixed;z-index:60;pointer-events:none;transform-origin:0 0;will-change:transform}
.moon-flyer .moon-shape{fill:#F1E8D2}
.moon-flyer .moon-star{fill:var(--gold);opacity:0}

/* ---------- Page ---------- */
.bg-pattern{position:fixed;left:0;right:0;top:-8vh;height:116vh;z-index:0;opacity:.05;pointer-events:none;will-change:transform}
.bg-pattern svg{width:100%;height:100%}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:84px 20px 0;text-align:center}
.sec{padding:64px 0}
.eyebrow{margin:0 0 14px;font:600 11px/1.4 var(--f-body);letter-spacing:.26em;text-transform:uppercase;color:var(--gold-deep)}
.h2{margin:0 0 18px;font-family:var(--f-display);font-weight:350;font-size:30px;line-height:1.15;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
[data-reveal]{opacity:0;transform:translateY(12px);transition:opacity 650ms var(--ease-out-expo) var(--d,0ms),transform 650ms var(--ease-out-expo) var(--d,0ms)}
[data-reveal="fade"]{transform:none}
[data-reveal].in{opacity:1;transform:none}

/* Arch component */
.arch{position:relative;--fill:var(--card)}
.arch-cap{width:100%;height:auto;overflow:visible;margin-bottom:-1px}
.arch-cap .fill{fill:var(--fill)}
.arch-cap .lat{fill:url(#lat);opacity:.35}
.arch-cap .ln{fill:none;stroke:var(--gold);stroke-width:1.05;stroke-linecap:round}
.arch-cap .orn{fill:none;stroke:var(--gold);stroke-width:1;stroke-linecap:round}
.arch-body{position:relative;background:var(--fill);padding:8px 26px 44px}
.arch-body::before,.arch-body::after{content:"";position:absolute;top:0;bottom:0;width:1.2px;background:var(--gold);transform:scaleY(0);transform-origin:50% 100%;transition:transform 750ms var(--ease-in-out)}
.arch-body::before{left:0}.arch-body::after{right:0}
.arch .base{position:absolute;left:0;right:0;bottom:0;height:1.2px;background:var(--gold);transform:scaleX(0);transition:transform 700ms var(--ease-in-out)}
.arch.in .arch-body::before,.arch.in .arch-body::after{transform:scaleY(1)}
.arch.in .base{transform:scaleX(1)}

/* Hero */
.hero{padding:0 0 40px}
.hero-arch .arch-body{padding-top:0;padding-bottom:52px}
.bismillah{margin:-6px 0 6px;font-family:var(--f-ar-display);font-weight:400;font-size:clamp(27px,7.6vw,38px);line-height:2;color:var(--gold-deep);direction:rtl;
  -webkit-mask-image:linear-gradient(270deg,#000 34%,transparent 66%);mask-image:linear-gradient(270deg,#000 34%,transparent 66%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:0% 0;mask-position:0% 0;
  transition:-webkit-mask-position 1500ms var(--ease-in-out) var(--d,0ms),mask-position 1500ms var(--ease-in-out) var(--d,0ms)}
.bismillah.in{-webkit-mask-position:100% 0;mask-position:100% 0}
.occasion{margin:4px 0 0;font-family:var(--f-display);font-weight:350;font-size:27px;letter-spacing:-.01em;font-variation-settings:"opsz" 72}
.occasion-ur{margin:2px 0 0;font-family:var(--f-ar);font-size:21px;line-height:1.9;color:var(--accent-deep)}
.cradle-wrap{position:relative;height:176px;margin:6px -26px 4px}
.cloud{position:absolute;pointer-events:none}
.cloud .drift{animation:drift var(--t,11s) ease-in-out infinite alternate}
.cloud svg{width:100%;height:auto}
.c1{left:8%;top:70px;width:30%;opacity:.55}.c1 svg{fill:var(--powder)}
.c2{right:7%;top:46px;width:25%;opacity:.55}.c2 svg{fill:var(--blush)}
.c3{left:34%;top:116px;width:32%;opacity:.9}.c3 svg{fill:#E6EEF4}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.cradle-moon{position:absolute;left:50%;top:14px;width:124px;margin-left:-62px;aspect-ratio:1/1;opacity:0;z-index:2}
.cradle-moon svg{width:100%;height:100%;overflow:visible;transform-origin:50% 50%;filter:drop-shadow(0 8px 12px rgba(42,52,65,.10))}
.moon-shape{fill:#F6EEDC;stroke:var(--gold);stroke-width:.8}
.moon-star{fill:var(--gold)}
.names{margin:6px 0 0}
.name{display:block;font-family:var(--f-display);font-weight:340;font-size:clamp(54px,17.5vw,84px);line-height:.98;letter-spacing:-.045em;font-variation-settings:"opsz" 144;color:var(--ink)}
.role{display:block;margin-top:8px;font:600 10.5px/1 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:rgba(42,52,65,.55);padding-left:.3em}
.amp{display:block;width:34px;height:34px;margin:18px auto 16px;color:var(--gold)}
.amp svg{width:100%;height:100%}

/* Marquee */
.marquee{position:relative;left:50%;width:100vw;margin-left:-50vw;overflow:hidden;border-top:1px solid rgba(201,164,92,.35);border-bottom:1px solid rgba(201,164,92,.35);padding:14px 0}
.marquee-track{display:flex;width:max-content;animation:marquee 70s linear infinite}
.marquee-item{display:inline-flex;align-items:center;gap:22px;padding-right:22px;font-family:var(--f-display);font-style:italic;font-weight:300;font-size:19px;white-space:nowrap;color:rgba(42,52,65,.8)}
.marquee-item svg{width:12px;height:12px;color:var(--gold)}
@keyframes marquee{to{transform:translateX(-50%)}}

/* Ornament */
.ornament{width:180px;margin:0 auto 22px}
.ornament path{fill:none;stroke:var(--gold);stroke-width:1.1;stroke-linecap:round}

/* Invitation */
.invite-copy{margin:0;font-family:var(--f-display);font-weight:300;font-size:22px;line-height:1.55;letter-spacing:-.005em;font-variation-settings:"opsz" 36}
.invite-copy .ln{display:block;opacity:0;transform:translateY(12px);transition:opacity 600ms var(--ease-out-expo) var(--d,0ms),transform 600ms var(--ease-out-expo) var(--d,0ms)}
.invite-copy.in .ln{opacity:1;transform:none}

/* Dua */
.dua-arch .arch-body{padding-top:14px}
.dua-ar{margin:10px 0 18px;font-family:var(--f-ar-display);font-size:clamp(25px,7vw,31px);line-height:2.15;color:var(--ink);direction:rtl}
.dua-tr{margin:0 0 14px;font-family:var(--f-display);font-style:italic;font-weight:300;font-size:18px;line-height:1.55;color:var(--gold-deep)}
.dua-en{margin:0;font-size:16.5px;line-height:1.65;color:rgba(42,52,65,.85)}
.dua-ref{margin:18px 0 0;font:600 10.5px/1 var(--f-body);letter-spacing:.26em;text-transform:uppercase;color:rgba(42,52,65,.5)}

/* Date */
.date-arch{--fill:#F7F1E4;max-width:330px;margin:0 auto}
.date-arch .arch-body{padding:0 20px 34px}
.day-big{font-family:var(--f-display);font-weight:300;font-size:118px;line-height:.9;letter-spacing:-.06em;font-variation-settings:"opsz" 144;font-variant-numeric:tabular-nums;margin-top:-18px}
.month{margin-top:10px;font-family:var(--f-display);font-size:24px;font-weight:350;letter-spacing:-.01em}
.weekday{margin-top:2px;font:600 11px/1.4 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep)}
.rule{width:40px;height:1px;background:var(--gold);margin:18px auto}
.time{font-size:17px;font-weight:500}
.countdown{display:flex;justify-content:center;gap:10px;margin-top:30px}
.cd-unit{min-width:66px;padding:12px 8px 10px;border-radius:18px;background:rgba(255,253,248,.8);border:1px solid rgba(201,164,92,.28)}
.cd-val{display:flex;justify-content:center;font-family:var(--f-display);font-weight:350;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 72}
.dg{display:inline-block;height:1em;overflow:hidden;width:.62em}
.strip{display:flex;flex-direction:column;will-change:transform}
.strip span{height:1em;line-height:1;display:block}
.cd-lab{margin-top:8px;font:600 9.5px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:rgba(42,52,65,.55);padding-left:.24em}
.cd-done{font-family:var(--f-display);font-style:italic;font-size:24px;color:var(--gold-deep)}

/* Guess */
.guess-cradle{width:220px;margin:6px auto 22px}
.guess-cradle svg{width:100%;height:auto;overflow:visible}
.guess-cradle .ln{fill:none;stroke:var(--gold);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.guess-cradle .soft{fill:none;stroke:rgba(42,52,65,.35);stroke-width:1.1;stroke-linecap:round}
.pills{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 18px;border-radius:999px;border:1px solid rgba(42,52,65,.12);font-weight:600;font-size:15.5px;transition:transform 140ms var(--ease-out-expo),box-shadow 200ms ease,border-color 200ms ease}
.pill svg{width:22px;height:22px}
.pill.boy{background:var(--powder)}.pill.girl{background:var(--blush)}
.pill:active{transform:scale(.96)}
.pill[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.22),0 8px 20px rgba(42,52,65,.08)}
.guess-msg{min-height:52px;margin:22px auto 0;max-width:320px;font-family:var(--f-display);font-style:italic;font-weight:300;font-size:18.5px;line-height:1.5;opacity:0;transform:translateY(8px);transition:opacity 600ms var(--ease-out-expo),transform 600ms var(--ease-out-expo)}
.guess-msg.show{opacity:1;transform:none}
.announce{font-family:var(--f-display);font-weight:350;font-size:34px;letter-spacing:-.02em;margin:0}
.announce-sub{margin:6px 0 0;font-family:var(--f-display);font-style:italic;color:var(--gold-deep)}
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none}

/* Venue */
.palace{width:260px;margin:0 auto 22px}
.palace svg{width:100%;height:auto;overflow:visible}
.palace path{fill:none;stroke:var(--gold);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.venue-name{margin:0;font-family:var(--f-display);font-weight:350;font-size:36px;letter-spacing:-.03em;font-variation-settings:"opsz" 120}
.venue-addr{margin:8px auto 26px;max-width:300px;color:rgba(42,52,65,.8)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;border:0;background:var(--night);color:var(--ivory);font-weight:600;font-size:15.5px;text-decoration:none;letter-spacing:.01em;box-shadow:0 10px 24px rgba(15,27,45,.18);transition:transform 140ms var(--ease-out-expo),box-shadow 200ms ease}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.wa{background:#1F6F54;width:100%}

/* RSVP */
.rsvp-card{text-align:left;background:rgba(255,253,248,.85);border:1px solid rgba(201,164,92,.3);border-radius:28px;padding:26px 22px 24px}
.field{margin-bottom:22px}
.field>label,.field .lab{display:block;margin-bottom:9px;font:600 11px/1.4 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:rgba(42,52,65,.65)}
.input{width:100%;min-height:52px;padding:12px 16px;border-radius:16px;border:1px solid rgba(42,52,65,.16);background:#fff;font-size:16.5px;outline:none;transition:border-color 160ms ease,box-shadow 160ms ease}
textarea.input{min-height:92px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.2)}
.input[aria-invalid="true"]{border-color:#B5524F;box-shadow:0 0 0 3px rgba(181,82,79,.14)}
.err{margin:8px 2px 0;font-size:13.5px;color:#9E3F3C;min-height:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:46px;padding:0 14px;border-radius:999px;border:1px solid rgba(42,52,65,.16);background:#fff;font-weight:600;font-size:14.5px;transition:background-color 180ms ease,border-color 180ms ease,transform 140ms var(--ease-out-expo)}
.seg button:active{transform:scale(.97)}
.seg button[aria-checked="true"]{background:var(--night);border-color:var(--night);color:var(--ivory)}
.stepper{display:inline-flex;align-items:center;gap:6px;padding:5px;border-radius:999px;border:1px solid rgba(42,52,65,.16);background:#fff}
.stepper button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(168,195,178,.28);font-size:20px;line-height:1;display:grid;place-items:center;transition:transform 140ms var(--ease-out-expo),opacity 150ms}
.stepper button:active{transform:scale(.92)}
.stepper button:disabled{opacity:.35}
.stepper output{min-width:44px;text-align:center;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;display:inline-block}
.field.hidden{display:none}

/* Closing */
.closing{padding-bottom:40px}
.closing-line{margin:0 auto;max-width:360px;font-family:var(--f-display);font-weight:300;font-style:italic;font-size:28px;line-height:1.35;letter-spacing:-.015em}
.signoff{margin:26px 0 0;color:rgba(42,52,65,.75)}
.signoff .sn{display:block;margin-top:4px;font-family:var(--f-display);font-size:26px;color:var(--ink);letter-spacing:-.02em}
.signoff .sn svg{display:inline-block;width:18px;height:18px;vertical-align:-2px;margin:0 6px;color:var(--gold)}
.closing-moon{width:84px;margin:36px auto 18px}
.closing-moon svg{width:100%;height:auto;overflow:visible}
.closing-moon.in svg{animation:glowOnce 2.6s var(--ease-in-out) 400ms 1 both}
@keyframes glowOnce{0%{filter:drop-shadow(0 0 0 rgba(201,164,92,0))}45%{filter:drop-shadow(0 0 18px rgba(201,164,92,.75))}100%{filter:drop-shadow(0 0 4px rgba(201,164,92,.25))}}
.hosted{margin:0;font-size:14.5px;color:rgba(42,52,65,.7)}
.hosted b{font-weight:600;color:var(--ink)}
.credit{position:relative;z-index:1;text-align:center;padding:26px 20px calc(30px + env(safe-area-inset-bottom));font-size:12px;letter-spacing:.08em;color:rgba(42,52,65,.45)}
.credit a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;transition:opacity 200ms ease}
.credit a:active{opacity:.7}
.credit img{height:18px;width:auto;display:block}

/* Top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity 600ms var(--ease-out-expo),transform 600ms var(--ease-out-expo);padding-top:env(safe-area-inset-top)}
.topbar.show{opacity:1;transform:none}

}

  $$('#attSeg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.attending = b.getAttribute('data-val'); setSeg($('#attSeg'), state.attending);
      $('#countField').classList.toggle('hidden', state.attending !== 'attending');
    });
  });
  var nameIn = $('#rName'), nameErr = $('#rNameErr');
  function validateName() {
    var v = nameIn.value.trim(), msg = '';
    if (!v) msg = 'Please enter your name so the family knows who is replying.';
    else if (v.length < 2) msg = 'Your name looks a little short. Please enter your full name.';
    nameErr.textContent = msg; nameIn.setAttribute('aria-invalid', String(!!msg)); return !msg;
  }
  nameIn.addEventListener('input', function () { if (nameIn.getAttribute('aria-invalid') === 'true') validateName(); });
  nameIn.addEventListener('blur', function () { if (nameIn.value) validateName(); });
  $('#rsvpForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!validateName()) { nameIn.focus(); return; }
    var guessTxt = { boy: 'Baby Boy', girl: 'Baby Girl', none: 'No guess' }[state.guess];
    var lines = [
      'Assalamu Alaikum,',
      '',
      '*RSVP: ' + CONFIG.occasion + ' of ' + CONFIG.dad + ' & ' + CONFIG.mom + '*',
      CONFIG.dateLong + ', ' + CONFIG.venueName,
      '',
      'Name: ' + nameIn.value.trim().replace(/\s+/g, ' '),
      'Response: ' + (state.attending === 'attending' ? 'Attending (' + state.guests + (state.guests > 1 ? ' guests' : ' guest') + ')' : 'Sending duas from afar')
    ];
    if (gender === 'surprise') lines.push('Boy or girl guess: ' + guessTxt);
    var note = $('#rNote').value.trim();
    if (note) lines.push('Note / dua: ' + note);
    lines.push('', 'JazakAllahu khairan');
    var url = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(lines.join('\n'));
    var w = window.open(url, '_blank', 'noopener'); if (!w) location.href = url;
  });

  /* ---------- Toast & share ---------- */
  var toastT;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  $('#shareBtn').addEventListener('click', function () {
    var url = location.origin + location.pathname;
    var data = { title: CONFIG.productName + ' · ' + CONFIG.occasion, text: 'You are invited to the ' + CONFIG.occasion + ' of ' + CONFIG.dad + ' & ' + CONFIG.mom + ', ' + CONFIG.dateLong + '.', url: url };
    if (nav.share) { nav.share(data).catch(function () {}); return; }
    function fallback() { var ta = d.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0'; d.body.appendChild(ta); ta.select(); try { d.execCommand('copy'); toast('Link copied'); } catch (e) { toast(url); } ta.remove(); }
    if (nav.clipboard && nav.clipboard.writeText) nav.clipboard.writeText(url).then(function () { toast('Link copied'); }, fallback); else fallback();
  });

  /* ---------- Background music: fades in on the opening tap ---------- */
  var Music = {
    el: null, on: false, raf: 0,
    load: function () {
      if (this.el || !CONFIG.music.src) return;
      this.el = new Audio(CONFIG.music.src); this.el.loop = true; this.el.preload = 'auto'; this.el.volume = 0;
    },
    fade: function (to, ms, done) {
      var a = this.el, from = a.volume, t0 = performance.now(), self = this;
      cancelAnimationFrame(this.raf);
      (function f(t) {
        var k = Math.min((t - t0) / ms, 1), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        a.volume = Math.max(0, Math.min(1, from + (to - from) * e));
        if (k < 1) self.raf = requestAnimationFrame(f); else if (done) done();
      })(t0);
    },
    play: function () {
      this.load(); if (!this.el) return;
      var self = this; this.on = true; syncBtn();
      var p = this.el.play();
      if (p && p.catch) p.catch(function () { self.on = false; syncBtn(); });
      this.fade(CONFIG.music.volume, CONFIG.music.fadeMs);
    },
    pause: function () {
      if (!this.el) return; var a = this.el; this.on = false; syncBtn();
      this.fade(0, 700, function () { a.pause(); });
    }
  };
  var musicBtn = $('#musicBtn');
  function syncBtn() {
    musicBtn.setAttribute('aria-pressed', String(Music.on));
    musicBtn.setAttribute('aria-label', Music.on ? 'Pause music' : 'Play music');
  }
  musicBtn.addEventListener('click', function () { if (Music.on) Music.pause(); else Music.play(); });
  d.addEventListener('visibilitychange', function () {
    if (!Music.el || !Music.on) return;
    if (d.hidden) Music.el.pause(); else Music.el.play().catch(function () {});
  });

  /* ================= OPENING FILM ================= */
  var opener = $('#opener'), stage = $('#stage'), opMoon = $('#opMoon'), doorL = $('#doorL'), doorR = $('#doorR');
  var innerSky = $('.inner-sky'), lantern = $('#lantern'), glow = $('#glow'), greet = $('#opGreet'), tap = $('#opTap');
  var ready = false, opened = false;
  var sky = $('#opSky'), stars = [];
  for (var i = 0; i < 22; i++) {
    var st = d.createElement('i'), sz = Math.random() < .25 ? 3 : 2;
    st.style.left = (Math.random() * 100).toFixed(2) + '%'; st.style.top = (Math.random() * 92).toFixed(2) + '%';
    st.style.width = st.style.height = sz + 'px'; st._o = (0.35 + Math.random() * 0.6).toFixed(2);
    sky.appendChild(st); stars.push(st);
  }
  var opLines = $$('.op-draw');
  opLines.forEach(function (p) { var L = p.getTotalLength(); p.style.strokeDasharray = L + ' ' + L; p.style.strokeDashoffset = L; p._L = L; });
  var doorSpringL = new Spring({ from: 0, stiffness: 70, damping: 14, mass: 1, eps: 0.2, onUpdate: function (x) { doorL.style.transform = 'rotateY(' + x.toFixed(2) + 'deg)'; } });
  var doorSpringR = new Spring({ from: 0, stiffness: 56, damping: 11, mass: 1.1, eps: 0.2, onUpdate: function (x) { doorR.style.transform = 'rotateY(' + x.toFixed(2) + 'deg)'; } });
  var lanternSpring = new Spring({ from: 16, stiffness: 120, damping: 14, eps: 0.05, onUpdate: function (x) { lantern.style.transform = 'rotate(' + x.toFixed(2) + 'deg)'; } });

  function beat4() {
    var tasks = [];
    if (guest) tasks.push(anim(greet, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 600, easing: EXPO }));
    tasks.push(anim(tap, [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: guest ? 200 : 0, easing: EXPO }));
    ready = true;
    return Promise.all(tasks);
  }

  function playOpener() {
    if (RM || !CAN_ANIM) {
      [opMoon, doorL, doorR, lantern, innerSky].forEach(function (el) { el.style.opacity = 1; });
      stars.forEach(function (s) { s.style.opacity = s._o; });
      opLines.forEach(function (p) { p.style.strokeDashoffset = 0; });
      lantern.style.transform = 'none';
      return beat4();
    }
    /* Beat 1: moon + stars */
    stars.forEach(function (s, i) { anim(s, [{ opacity: 0 }, { opacity: s._o }], { duration: 600, delay: i * 40, easing: 'ease-out' }); });
    return anim(opMoon, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 800, easing: EXPO })
      /* Beat 2: arch draws from base up, both sides meet at apex */
      .then(function () {
        return Promise.all(opLines.map(function (p, i) {
          return anim(p, [{ strokeDashoffset: p._L }, { strokeDashoffset: 0 }], { duration: 1000, delay: i > 1 ? 120 : 0, easing: INOUT });
        }));
      })
      /* Beat 3: doors fade in closed, lantern sways once on a spring */
      .then(function () {
        anim(lantern, [{ opacity: 0 }, { opacity: 1 }], { duration: 500, easing: EXPO });
        lanternSpring.set(16); lanternSpring.to(0);
        anim(innerSky, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 750 });
        return Promise.all([
          anim(doorL, [{ opacity: 0 }, { opacity: 1 }], { duration: 800, easing: EXPO }),
          anim(doorR, [{ opacity: 0 }, { opacity: 1 }], { duration: 800, delay: 60, easing: EXPO })
        ]);
      })
      /* Beat 4: wait for the tap */
      .then(beat4);
  }

  function flyMoon() {
    var target = $('#cradleMoon');
    if (RM || !CAN_ANIM) return Promise.resolve();
    var a = opMoon.getBoundingClientRect(), b = target.getBoundingClientRect();
    var fly = d.createElement('div'); fly.className = 'moon-flyer'; fly.setAttribute('aria-hidden', 'true');
    fly.innerHTML = opMoon.innerHTML;
    fly.style.left = a.left + 'px'; fly.style.top = a.top + 'px'; fly.style.width = a.width + 'px'; fly.style.height = a.height + 'px';
    d.body.appendChild(fly); opMoon.style.visibility = 'hidden';
    var s = b.width / a.width, dx = b.left - a.left, dy = b.top - a.top, svg = fly.querySelector('svg');
    var opt = { duration: 1500, delay: 200, easing: INOUT };
    svg.style.transform = 'none';
    anim(svg, [{ transform: 'rotate(-35deg)', filter: 'drop-shadow(0 0 12px rgba(244,226,180,.6))' }, { transform: 'rotate(0deg)', filter: 'drop-shadow(0 8px 12px rgba(42,52,65,.10))' }], opt);
    anim(fly.querySelector('.moon-star'), [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 1200, easing: EXPO });
    return anim(fly, [{ transform: 'translate(0px,0px) scale(1)' }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')' }], opt)
      .then(function () { target.style.opacity = 1; return anim(fly, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }); })
      .then(function () { fly.remove(); });
  }

  function revealPage() {
    $('#page').removeAttribute('aria-hidden');
    $('#topbar').classList.add('show');
    splitLines();
    startReveals(); startParallax();
  }

  function openDoors() {
    if (!ready || opened) return; opened = true;
    if (CONFIG.music.autoplay) Music.play();
    opener.setAttribute('aria-hidden', 'true');
    if (RM || !CAN_ANIM) {
      doorSpringL.set(-105); doorSpringR.set(105); glow.style.opacity = 1;
      $('#cradleMoon').style.opacity = 1;
      revealPage();
      return anim(opener, [{ opacity: 1 }, { opacity: 0 }], { duration: 450, easing: 'ease-out' }).then(finishOpener);
    }
    anim(greet, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 });
    anim(tap, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 });
    /* Beat 5: doors swing on distinct springs, light spills, camera pushes through */
    doorSpringL.to(-105);
    wait(50).then(function () { doorSpringR.to(105); });
    anim(glow, [{ opacity: 0, transform: 'scale(.55)' }, { opacity: 1, transform: 'scale(2.6)' }], { duration: 1600, easing: EXPO });
    anim(stage, [{ transform: 'scale(0.97)' }, { transform: 'scale(2.6)' }], { duration: 1900, easing: INOUT });
    anim(sky, [{ opacity: 1 }, { opacity: 0 }], { duration: 900, easing: INOUT });
    /* Beat 6: the moon becomes the cradle */
    flyMoon().then(startRock);
    wait(700).then(function () {
      revealPage();
      return anim(opener, [{ opacity: 1, offset: 0 }, { opacity: .85, offset: .35 }, { opacity: 0, offset: 1 }], { duration: 1300, easing: 'cubic-bezier(0.4,0,0.2,1)' });
    }).then(finishOpener);
  }
  function finishOpener() {
    opener.remove(); d.body.classList.remove('locked');
    if (RM) return;
  }

  opener.addEventListener('pointerdown', function () {
    if (!ready || opened || !CAN_ANIM) return;
    stage.animate([{ transform: 'scale(1)' }, { transform: 'scale(0.97)' }], { duration: 120, easing: EXPO, fill: 'forwards' });
  });
  opener.addEventListener('pointerleave', function () { if (ready && !opened && CAN_ANIM) stage.animate([{ transform: 'scale(0.97)' }, { transform: 'scale(1)' }], { duration: 160, easing: EXPO, fill: 'forwards' }); });
  opener.addEventListener('click', openDoors);
  opener.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDoors(); } });

  function go() { opener.focus({ preventScroll: true }); playOpener(); Music.load(); }
  if (d.fonts && d.fonts.ready) Promise.race([d.fonts.ready, wait(900)]).then(go); else go();
})();
</script>
</body>
</html>
